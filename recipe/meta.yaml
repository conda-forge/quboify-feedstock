{% set version = "1.1.4" %}
{% set python_min = "3.13.3" %}

package:
  name: quboify
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/q/quboify/quboify-{{ version }}.tar.gz
  sha256: bd510ff9e7642445c3ad41ae75340a97c7c11816f154a0479d390b6f7e91b3e0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - qubovert >=1.2.5
    - sympy

test:
  imports:
    - quboify
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/quboify/
  summary: Symbolic QUBO Modeling
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - henrikarhula
